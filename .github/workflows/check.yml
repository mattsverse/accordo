name: Check

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [macos-14, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings -D clippy::pedantic -D clippy::perf -D clippy::suspicious
      - run: cargo check --locked --all-targets --all-features
      - run: cargo test --locked
      - run: python3 tests/terminal_smoke.py
