name: Publish crate

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
      - name: Check whether this version is already published
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version=1 | jq -er '.packages[] | select(.name == "accordo") | .version')
          status=$(curl --silent --show-error --location --retry 3 \
            --user-agent 'accordo-release (github.com/mattsverse/accordo)' \
            --output "$RUNNER_TEMP/crate.json" --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/accordo/$version")
          case "$status" in
            200)
              jq -e --arg version "$version" '
                .version | .crate == "accordo" and .num == $version and .yanked == false
              ' "$RUNNER_TEMP/crate.json"
              echo 'published=true' >> "$GITHUB_OUTPUT" ;;
            404) echo 'published=false' >> "$GITHUB_OUTPUT" ;;
            *) echo "crates.io returned HTTP $status" >&2; exit 1 ;;
          esac
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.version.outputs.published != 'true'
        id: auth
      - name: Publish to crates.io
        if: steps.version.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
